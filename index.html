<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretwise</title>
<meta name="description" content="Chord shapes, neck maps and song sheets for guitar.">
<meta name="theme-color" content="#1d1511">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fretwise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
// Interface size. Everything in the stylesheet is in rem, so this one number scales the whole app.
// Tablets aim for a layout about 980pt wide in portrait and 1240pt in landscape; phones and desktops stay at 1.
(function () {
  var SIZES = { smaller: 0.85, auto: 1, larger: 1.15, largest: 1.3 };
  function apply() {
    var size = "auto";
    try { size = JSON.parse(localStorage.getItem("fretwise.prefs") || "{}").uiSize || "auto"; } catch (e) {}
    var w = window.innerWidth, h = window.innerHeight;
    var touch = (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && matchMedia("(pointer: coarse)").matches);
    var tablet = touch && Math.min(w, h) >= 700;
    var s = 1;
    if (tablet) s = Math.min(2.2, Math.max(1.1, w / (h >= w ? 980 : 1240)));
    s *= SIZES[size] || 1;
    var eff = w / s, r = document.documentElement;
    r.style.fontSize = (16 * s).toFixed(2) + "px";
    r.classList.toggle("tablet", tablet);
    r.classList.toggle("wide", eff >= 900);
    r.classList.toggle("xwide", eff >= 1150);
    r.classList.toggle("small", eff <= 560);
    r.classList.toggle("narrow", eff <= 420);
  }
  window.__fwScale = apply;
  apply();
  window.addEventListener("resize", apply);
  window.addEventListener("orientationchange", function () { setTimeout(apply, 120); });
})();
</script>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Sections">
    <button data-go="#/chords" aria-label="Chords">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="4" width="16" height="18" rx="1.5"/><path d="M5 9h16M5 14h16M5 19h16M10.3 4v18M15.6 4v18"/><circle class="ac" cx="10.3" cy="11.5" r="2.2" fill="currentColor" stroke="none"/><circle cx="15.6" cy="16.5" r="2.2" fill="currentColor" stroke="none"/></svg>
      <span>Chords</span>
    </button>
    <button data-go="#/shapes" aria-label="Shapes">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h10M8 7.5h10M8 12h10M8 16.5h10M8 3v13.5M11.3 3v13.5M14.7 3v13.5M18 3v13.5"/><circle class="ac" cx="11.3" cy="9.75" r="2" fill="currentColor" stroke="none"/><circle cx="14.7" cy="14.25" r="2" fill="currentColor" stroke="none"/><path d="M4 22h18M6.5 19.5L4 22l2.5 2.5M19.5 19.5L22 22l-2.5 2.5"/></svg>
      <span>Shapes</span>
    </button>
    <button data-go="#/songs" aria-label="Songs">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 6h11M5 11h11M5 16h7"/><path d="M19 19.5V7.5l4-1.5"/><circle class="ac" cx="17" cy="19.5" r="2.4" fill="currentColor" stroke="none"/></svg>
      <span>Songs</span>
    </button>
    <button data-go="#/settings" aria-label="Settings">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h18M4 13h18M4 19h18"/><circle class="ac" cx="9" cy="7" r="2.4" fill="currentColor" stroke="none"/><circle cx="17" cy="13" r="2.4" fill="var(--bg-2)"/><circle cx="11" cy="19" r="2.4" fill="var(--bg-2)"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
